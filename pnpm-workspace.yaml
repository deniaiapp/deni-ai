allowBuilds:
  '@swc/core': false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@tanstack/react-start-rsc@0.1.63'
  - '@tanstack/react-start-server@1.167.50'
  - '@tanstack/react-start@1.169.2'
  - '@tanstack/router-generator@1.167.44'
  - '@tanstack/router-plugin@1.168.46'
  - '@tanstack/router-utils@1.162.4'
  - '@tanstack/start-plugin-core@1.171.53'
  - '@tanstack/start-server-core@1.169.43'
# Nitro hoists one tslib into .output/server/node_modules for every bundled import. tsyringe asks
# for tslib 1, which lacks helpers like __spreadArray that tslib 2 users need, and 2 is a superset.
overrides:
  tslib: ^2.8.1
