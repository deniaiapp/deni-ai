  <style>.bob{animation:bob 4.4s ease-in-out infinite} .blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}} @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}} @media (prefers-reduced-motion:reduce){*{animation:none!important}} .look{animation:look 6s ease-in-out infinite}@keyframes look{0%,20%,100%{transform:translateX(0)}30%,45%{transform:translateX(-2.5px)}55%,70%{transform:translateX(2.5px)}}.sway{transform-origin:42px 17px;animation:sway 3.6s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}</style>
