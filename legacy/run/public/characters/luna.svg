<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>.bob{animation:bob 4.4s ease-in-out infinite} .blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}} @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}} @media (prefers-reduced-motion:reduce){*{animation:none!important}} .moon{animation:moon 3.2s ease-in-out infinite}@keyframes moon{0%,100%{opacity:1}50%{opacity:.6}}.z{animation:z 3.6s ease-out infinite;opacity:0}.z2{animation-delay:1.8s}@keyframes z{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(5px,-9px);opacity:0}}.tw{animation:moon 2.6s ease-in-out infinite}.tw2{animation-delay:1.3s}</style>
