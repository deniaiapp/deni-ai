# Workspace checks for every package (apps/web, apps/support, services/agent-api
# and packages/*), plus the apps/web end-to-end tests against Postgres. Each job installs the whole workspace once from the root
# lockfile and runs the root `pnpm -r` scripts, which skip packages that do not
# define the script.

name: CI

on:
  push:
    branches: ["canary"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version comes from package.json `packageManager`
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # oxfmt runs in the packages that define `format:check` (apps/support and
      # services/agent-api are not oxfmt-formatted).
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vitest in apps/web and packages/*, `node --test` (PGlite) in the agent API.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No secrets are needed: apps/web reads server env at runtime only.
      - run: pnpm build
      # The web build rewrites messages/en.json from the inline messages; a
      # diff means a catalog change was not committed.
      - name: Check that the build left no uncommitted changes
        run: git diff --exit-code

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Throwaway database: global setup migrates it, the tests create their own accounts.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deni_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deni_ai_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @deniai/web exec playwright install --with-deps chromium
      # Builds apps/web with the e2e env, starts it and a mock Deni AI API
      # (apps/web/playwright.config.ts); no provider keys or secrets are used.
      - run: pnpm --filter @deniai/web test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  db-schema:
    name: Drizzle schema is migrated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@deniai/db..."
      # `drizzle-kit generate` diffs the schema against the migration snapshots
      # without a database connection. Any new or changed file means a schema
      # edit is missing its generated migration.
      - name: Generate public schema migrations (drizzle.config.ts)
        working-directory: packages/db
        run: pnpm exec drizzle-kit generate
      - name: Generate flixa schema migrations (drizzle.flixa.config.ts)
        working-directory: packages/db
        run: pnpm exec drizzle-kit generate --config drizzle.flixa.config.ts
      - name: Fail on pending migrations
        run: |
          changes="$(git status --porcelain -- packages/db)"
          if [ -n "$changes" ]; then
            echo "::error::Schema changes without a migration. Run pnpm --filter @deniai/db db:generate (and db:generate:flixa) and commit the result."
            echo "$changes"
            git diff -- packages/db
            exit 1
          fi
