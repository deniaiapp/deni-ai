name = "flixa-backend"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[limits]
# Upstream waits do not count; this only covers JSON parsing / stream conversion.
cpu_ms = 60000

[observability]
enabled = true

# Create with: bunx wrangler hyperdrive create flixa-deni --connection-string="postgres://..."
[[hyperdrive]]
binding = "DENI_DB"
id = "<hyperdrive-id>"

# Plain vars. Secrets (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, ADMIN_PASSWORD, ...)
# go in via `bunx wrangler secret put <NAME>`.
[vars]
NODE_ENV = "production"
ADMIN_COOKIE_SECURE = "true"
# Hyperdrive pools upstream; keep the per-request pool tiny and short-lived.
DENI_DATABASE_POOL_MAX = "3"
DENI_DATABASE_IDLE_TIMEOUT_MS = "1000"

# Shared fixed-window rate limiter (one instance per scope:key).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]
